name: CMBS maturity probe
# Research only (tools/cmbs_probe.py): counts, totals and a short property-level list from the CMBS asset data on EDGAR.
# No raw filings are kept; probes/cmbs-<date>.json stays under about 200 KB.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cmbs-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/cmbs_probe.py
      - name: Commit the probe
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add probes/cmbs-*.json
          git diff --cached --quiet && exit 0
          git commit -m "CMBS maturity probe $(date -u +%F) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
