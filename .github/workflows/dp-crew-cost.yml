name: Chicago crew cost data
# Free page /chicago-crew-cost/ (Todd, Oct 27, 2026: "Let's do them all"; coo/PARALLEL_BUILDS.md).
# The BLS wage file, the IDOL Cook County schedule and the City notice were downloaded by Todd in his browser and read
# into site/datapages/dp_crew_cost/data.json (tools/dp_crew_cost_fetch.py ingest): bls.gov and chicago.gov PDFs refuse
# our runners, and IDOL lists county files by script. This weekly job re-reads the official pages it can reach (City
# minimum wage page, Cook County notice, IRS Publication 15, IDOL current rates date) and records PASS or FAIL for each
# figure in watch.json. A FAIL turns the run red: a source changed, so the files need a new download and ingest.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "ci-verify only: the commit to compare docs/ against"
        required: false
        default: "HEAD~1"
  push:
    branches: [main]
    paths: ["tools/dp_crew_cost_fetch.py", ".github/workflows/dp-crew-cost.yml"]
  schedule:
    - cron: "20 12 * * 2"   # Tuesdays, about 7:20 am Chicago time in standard time
permissions:
  contents: write
concurrency:
  group: dp-crew-cost
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/dp_crew_cost_fetch.py --selftest
      - name: Re-read the official pages against the page's figures
        run: python3 tools/dp_crew_cost_fetch.py watch || echo "WATCH_FAIL=1" >> "$GITHUB_ENV"
      - name: Rebuild the site pages
        run: python3 tools/make_site.py
      - name: Commit
        run: bash tools/push_rebuilt.sh "Chicago crew cost source check $(TZ=America/Chicago date +%Y-%m-%d)" site/datapages/dp_crew_cost/watch.json
      - name: A source changed
        if: env.WATCH_FAIL == '1'
        run: |
          echo "A watched figure no longer matches its source (site/datapages/dp_crew_cost/watch.json). Download the new file and re-run ingest."
          exit 1
  ci-verify:
    # By hand only: the same check as the Verify site workflow, with each FAIL line raised as an annotation so the
    # crew can read it through the API (run logs and artifacts are not reachable from the cloud sessions).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet playwright pillow cryptography openpyxl
      - run: python -m playwright install --with-deps chromium
      - name: Verify like the site workflow and annotate the FAIL lines
        run: |
          python3 tools/verify_site.py --changed "${{ inputs.base || 'HEAD~1' }}" --flows --out data/verify/ci > verify.log 2>&1 || true
          grep -E "^(FAIL|verify:)" verify.log | head -40 | while IFS= read -r l; do echo "::warning::${l}"; done
          cd docs && (python3 -m http.server 8811 > /dev/null 2>&1 &) && sleep 2 && cd ..
          python3 - <<'PY' | head -20 | while IFS= read -r l; do echo "::warning::${l}"; done
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  for scheme in ("light",):
                      pg = await b.new_page(viewport={"width": 390, "height": 900}, color_scheme=scheme)
                      await pg.goto("http://localhost:8811/", wait_until="networkidle")
                      r = await pg.evaluate("""[...document.querySelectorAll('a.btn,button,.btn')].map(e=>{const b=e.getBoundingClientRect();const c=getComputedStyle(e);return [Math.round(b.left),Math.round(b.right),e.textContent.trim().slice(0,60),c.whiteSpace,c.fontFamily.slice(0,30),c.fontSize,e.parentElement.className.slice(0,40)]}).filter(x=>x[1]>390)""")
                      for x in r: print("OVER", scheme, x)
                      print("UA", await pg.evaluate("navigator.userAgent"))
                  await b.close()
          asyncio.run(main())
          PY
