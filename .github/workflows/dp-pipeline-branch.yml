name: Construction pipeline data (branch test)
# Branch-only test pull for tools/dp_pipeline_data.py; commits the counts file (never the sealed state) to this branch.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-4bg5nr]
    paths: ["tools/dp_pipeline_data.py", ".github/workflows/dp-pipeline-branch.yml"]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet cryptography
      - run: python3 tools/dp_pipeline_data.py --selftest
      - name: Pull (tracker sealing tested, nothing committed)
        env:
          PNF_DATA_KEY: ${{ secrets.PNF_DATA_KEY }}
        run: |
          python3 tools/dp_pipeline_data.py
          test -s site/datapages/dp_pipeline/state.sealed.json && echo "sealed state written ($(wc -c < site/datapages/dp_pipeline/state.sealed.json) bytes)" || echo "no sealed state"
      - name: Commit the counts to this branch
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add site/datapages/dp_pipeline/data.json
          git diff --cached --quiet && exit 0
          git commit -m "Construction pipeline counts (branch test pull)"
          git push origin HEAD:claude/project-thread-4bg5nr
