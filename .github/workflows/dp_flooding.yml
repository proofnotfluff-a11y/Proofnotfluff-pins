name: Chicago basement flooding calls
# Free page /chicago-basement-flooding/ (Todd's go, Oct 27, 2026, coo/PARALLEL_BUILDS.md, build B8). The cloud agents
# cannot reach data.cityofchicago.org, so this runner counts the City's 311 water in basement and sewer requests and
# commits only counts. First run: the source check (tools/dp_probe_b8.py) confirms the request type names.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/dp_probe_b8.py", ".github/workflows/dp_flooding.yml"]
permissions:
  contents: write
concurrency:
  group: dp-flooding
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Source check (columns, request types, violation descriptions, City terms)
        run: python3 tools/dp_probe_b8.py
      - name: Commit
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add site/datapages/dp_flooding site/datapages/dp_repairs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "B8 source check $(TZ=America/Chicago date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
