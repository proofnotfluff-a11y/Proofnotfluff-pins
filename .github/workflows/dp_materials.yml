name: Material price indexes (BLS PPI)
# Free page /material-price-changes/ (tools/dp_materials.py; Todd, Oct 27, 2026: "Let's do them all"). The cloud agents
# cannot reach bls.gov, so this runner reads the chosen series through the BLS Public Data API and commits them to
# site/datapages/dp_materials/. BLS publishes the PPI once a month, mid month; the weekday run picks up each release
# (and BLS's revisions) the same day and commits only when a number changed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/dp_materials_bls.py", ".github/workflows/dp_materials.yml", "site/datapages/dp_materials/series.json"]
  schedule:
    - cron: "10 15 * * 1-5"
permissions:
  contents: write
concurrency:
  group: dp-materials
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Self-checks (planted files)
        run: python3 tools/dp_materials_bls.py --selftest
      - name: Pull BLS producer price indexes
        run: python3 tools/dp_materials_bls.py
      - name: Commit
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add site/datapages/dp_materials
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Material price indexes (BLS PPI) $(TZ=America/Chicago date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
