name: Chicago repair demand by trade
# Free page /chicago-repair-demand/ (Todd's go, Oct 27, 2026, coo/PARALLEL_BUILDS.md, build B8). The cloud agents
# cannot reach data.cityofchicago.org, so this runner reads the City's Building Violations one month at a time, sorts
# each violation into a trade with the published mapping (site/datapages/dp_repairs/trade-map.json), places its map
# point in a community area, and commits only the counts (site/datapages/dp_repairs/monthly.json).
# tools/dp_repairs_data.py says what is kept: no address, location, inspector, comment or property detail ever
# leaves the runner.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/dp_repairs_data.py", "tools/dp_repairs.py", "site/datapages/dp_repairs/trade-map.json", ".github/workflows/dp_repairs.yml"]
  schedule:
    - cron: "50 11 * * *"   # every day, about 6:50 am Chicago time in daylight time
permissions:
  contents: write
concurrency:
  group: dp-repairs
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet cryptography openpyxl pillow
      - name: Self-checks (planted cases)
        run: |
          python3 tools/dp_repairs_data.py --selftest
          python3 tools/dp_repairs.py --selftest
      - name: Count the City's building violations by trade
        run: python3 tools/dp_repairs_data.py
      - name: Rebuild the site pages from the new counts
        run: python3 tools/make_site.py
      - name: Commit
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add -A site/datapages/dp_repairs/monthly.json docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Chicago repair demand data $(TZ=America/Chicago date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            tar -czf "$RUNNER_TEMP/keep.tgz" site/datapages/dp_repairs/monthly.json 2>/dev/null || true
            git fetch origin main && git reset --hard origin/main
            tar -xzf "$RUNNER_TEMP/keep.tgz"
            python3 tools/make_site.py
            git add -A site/datapages/dp_repairs/monthly.json docs
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Chicago repair demand data $(TZ=America/Chicago date +%Y-%m-%d)"
            sleep 10
          done
          exit 1
