name: Chicago elevator violations and permits
# growth-research Phase B (Todd, Oct 22, 2026 live chat): sample counts for a candidate lead list (tools/elevator_chicago.py).
# The cloud agents cannot reach data.cityofchicago.org, so the runner counts and commits probes/elevator-chicago-<date>.json.
# Counts only: no row, address, business or person name is written.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/elevator_chicago.py", "tools/exterior_chicago.py", ".github/workflows/elevator-chicago.yml"]
permissions:
  contents: write
concurrency:
  group: probes-commit
  cancel-in-progress: false
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/elevator_chicago.py --selftest
      - run: python3 tools/elevator_chicago.py
      - name: Commit the counts
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add probes/
          git diff --cached --quiet && exit 0
          git commit -m "Chicago elevator violations and permits counts $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
