name: Hub featured products
# Rebuilds the link hub (docs/go/) when a promo spec lands, so "link in bio" shows the product from the newest videos first (Todd, Oct 15, 2026).
on:
  push:
    branches: [main]
    paths: ["promo/specs/**", "site/links.json"]
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hub-featured
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/make_site.py
      - name: Commit if the hub changed
        run: |
          git config user.name "ProofNotFluff hub bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Hub: featured products from the newest promo specs"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
