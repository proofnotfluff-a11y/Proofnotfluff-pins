name: Chicago inspection leads
# Product #3 (Oct 17, 2026): Chicago Restaurant Inspection Leads for pest control, hood cleaning and grease
# trap companies. The cloud agents cannot reach data.cityofchicago.org, so this runner pulls the City's Food
# Inspections data and commits only business-level files to permits/inspections-chicago/ (no comments, no names
# of people). tools/inspections_chicago.py says what is kept.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/inspections_chicago.py", "tools/rest_*.py", ".github/workflows/inspections-chicago.yml"]
  schedule:
    - cron: "30 11 * * 1"   # Mondays, about 6:30 am Chicago time in daylight time
permissions:
  contents: write
concurrency:
  group: inspections-chicago
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/inspections_chicago.py --selftest
      - run: python3 tools/inspections_chicago.py --probe
      - run: pip install --quiet cryptography openpyxl pillow
      - run: python3 tools/rest_seal.py --selftest
      - run: python3 tools/inspections_chicago.py --full "$RUNNER_TEMP/inspections-full.json" --raw "$RUNNER_TEMP/inspections-raw.json"
      - name: Seal the raw pull for the crew's offline checks (public-key box; the private key is never in the repo)
        run: python3 tools/rest_seal.py seal "$RUNNER_TEMP/inspections-raw.json" permits/inspections-chicago/raw.sealed.json
      - name: Keep the full weekly list out of the repo (short-lived artifact; it holds raw violation notes)
        uses: actions/upload-artifact@v4
        with:
          name: inspections-full
          path: ${{ runner.temp }}/inspections-full.json
          retention-days: 3
      - name: Restaurant leads self-checks
        run: |
          python3 tools/rest_leads.py --selftest
          python3 tools/rest_xlsx.py --selftest
          python3 tools/rest_app.py --selftest
          python3 tools/rest_site.py
      - name: Free sample for the restaurant leads page (public; failed places are not named)
        run: python3 tools/rest_leads.py --sample "$RUNNER_TEMP/inspections-raw.json" permits/inspections-chicago/rest-sample.json
      - name: Build the restaurant members' app (encrypted; skipped until the REST_LEADS_PASSWORD secret exists)
        env:
          REST_LEADS_PASSWORD: ${{ secrets.REST_LEADS_PASSWORD }}
        run: |
          if [ -z "$REST_LEADS_PASSWORD" ]; then echo "no REST_LEADS_PASSWORD secret yet; members' app not built"; exit 0; fi
          python3 tools/rest_leads.py "$RUNNER_TEMP/inspections-raw.json" "$RUNNER_TEMP/rest-data.json"
          python3 tools/rest_xlsx.py "$RUNNER_TEMP/rest-data.json" "$RUNNER_TEMP/rest-leads.xlsx"
          python3 tools/rest_app.py "$RUNNER_TEMP/rest-data.json" "$RUNNER_TEMP/rest-leads.xlsx" docs/chicago-restaurant-leads-members/index.html
      - name: Rebuild the site pages from the new samples
        run: python3 tools/make_site.py
      - name: Commit
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add permits/inspections-chicago docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Chicago inspection leads data $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
