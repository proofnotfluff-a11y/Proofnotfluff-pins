name: Kimi smoke test
# One tiny test of Todd's Kimi Code membership key (repo secret KIMI_API, never printed), Oct 29, 2026.
# Calls go through Claude Code, a coding agent Kimi documents for this key, pointed at Kimi's Anthropic-compatible
# endpoint (https://api.kimi.ai/coding/, per kimi.com/code/docs/en/third-party-tools/claude-code.html). No hand-made
# client and no changed User-Agent: Kimi's membership guide treats a changed User-Agent as a violation.
# Lives on the kimi-smoke-test branch only; nothing here touches main, the studio or the routines.
on:
  push:
    branches: [kimi-smoke-test]
    paths: [".github/workflows/kimi-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Claude Code
        run: npm install -g --silent @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
      - name: Reach Kimi (no key sent)
        run: |
          curl -sS -o /dev/null -m 30 -w "Kimi endpoint reachable: HTTP %{http_code} in %{time_total}s (401 expected without a key)\n" https://api.kimi.ai/coding/v1/models || echo "FAIL Kimi endpoint not reachable from GitHub"
      - name: One tiny call per model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.KIMI_API }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_TELEMETRY: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_MAX_RETRIES: "1"
          API_TIMEOUT_MS: "90000"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "FAIL secret KIMI_API is empty or missing"; exit 1; fi
          echo "PASS secret present (length ${#ANTHROPIC_API_KEY})"
          # Strip stray spaces or line breaks a paste can add (value never printed)
          ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"; export ANTHROPIC_API_KEY
          echo "Key length after trimming spaces: ${#ANTHROPIC_API_KEY}"
          pass=0
          # Kimi's FAQ lists two Kimi Code addresses (overseas and China) and says the key must match the right one
          for base in https://api.kimi.ai/coding/ https://api.kimi.com/coding/; do
          export ANTHROPIC_BASE_URL="$base"
          for m in k3.1-pro k3 kimi-for-coding; do
            export ANTHROPIC_MODEL="$m" ANTHROPIC_DEFAULT_HAIKU_MODEL="$m" ANTHROPIC_DEFAULT_SONNET_MODEL="$m" ANTHROPIC_DEFAULT_OPUS_MODEL="$m"
            start=$(date +%s)
            set +e
            out=$(timeout 150 claude -p "Reply with exactly the word PONG and nothing else." --max-turns 1 --output-format json </dev/null 2>err.txt)
            code=$?
            set -e
            secs=$(( $(date +%s) - start ))
            text=$(printf '%s' "$out" | python3 -c 'import json,sys; s=sys.stdin.read().strip(); d=json.loads(s) if s.startswith("{") else {}; u=d.get("usage") or {}; print("error" if d.get("is_error") else "ok", str(d.get("result",""))[:160].replace(chr(10)," "), "| tokens in", u.get("input_tokens"), "cache", u.get("cache_read_input_tokens"), "out", u.get("output_tokens"))' 2>/dev/null || echo unparsed)
            if printf '%s' "$out" | grep -q PONG; then
              echo "PASS $base $m ${secs}s: $text"; pass=$((pass+1))
            else
              echo "FAIL $base $m exit $code ${secs}s: $text"
              # A rejected key fails the same way for every model, so skip the rest of this address
              printf '%s' "$text" | grep -q " 401 " && break
            fi
          done
          done
          rm -f err.txt
          echo "SUMMARY $pass model and address pairs answered"
          [ "$pass" -gt 0 ]
