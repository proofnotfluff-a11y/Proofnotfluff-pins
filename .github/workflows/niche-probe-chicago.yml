name: Chicago niche probe
# growth-research Phase B (Todd, Oct 22, 2026 live chat): counts and column names only for candidate City of Chicago
# signals (tools/niche_probe_chicago.py). The cloud agents cannot reach data.cityofchicago.org, so the runner counts and
# commits probes/niches-chicago-<date>.json. No row, address, business or person name is written.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/niche_probe_chicago.py", ".github/workflows/niche-probe-chicago.yml"]
permissions:
  contents: write
concurrency:
  group: niche-probe-chicago
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/niche_probe_chicago.py --selftest
      - run: python3 tools/niche_probe_chicago.py
      - name: Commit the probe
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add probes/
          git diff --cached --quiet && exit 0
          git commit -m "Chicago niche probe $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
