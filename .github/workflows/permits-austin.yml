name: Austin permit leads sample
# Austin Construction Cleaning Leads (product #2 on the permit engine, Oct 17, 2026). The cloud agents cannot reach
# data.austintexas.gov, so this runner pulls the City of Austin's Issued Construction Permits data and commits only the
# filtered, business-level sample to permits/austin/ (tools/permits_austin.py says what is kept), and, once the
# AUSTIN_LEADS_PASSWORD secret exists, the encrypted members' app at docs/austin-leads-members/ (the same pattern as
# inspections-chicago.yml). Nothing here launches: the free page stays a draft (noindex) until the launch checklist is complete.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/permits_austin.py", ".github/workflows/permits-austin.yml"]
  schedule:
    - cron: "35 11 * * 1"   # Mondays, after the Chicago run
permissions:
  contents: write
concurrency:
  group: permits-austin
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/permits_chicago.py --selftest
      - run: python3 tools/permits_austin.py --selftest
      - run: pip install --quiet pypdf openpyxl cryptography pillow
      - name: Pull the City's data (the full list stays in the runner and is never committed in the clear)
        run: python3 tools/permits_austin.py --full "$RUNNER_TEMP/austin-full.json"
      - name: Build the Austin members' app (encrypted; skipped until the AUSTIN_LEADS_PASSWORD secret exists)
        env:
          AUSTIN_LEADS_PASSWORD: ${{ secrets.AUSTIN_LEADS_PASSWORD }}
        run: |
          if [ -z "$AUSTIN_LEADS_PASSWORD" ]; then echo "no AUSTIN_LEADS_PASSWORD secret yet; members' app not built"; exit 0; fi
          python3 tools/leads_xlsx.py --selftest
          python3 tools/leads_app.py --selftest
          python3 tools/leads_xlsx.py "$RUNNER_TEMP/austin-full.json" "$RUNNER_TEMP/austin-leads.xlsx"
          # the same members' app code as Chicago's (tools/leads_app.py); the city comes from the list's source block
          python3 tools/leads_app.py "$RUNNER_TEMP/austin-full.json" "$RUNNER_TEMP/austin-leads.xlsx" docs/austin-leads-members/index.html
      - name: Buyer click-through and the free page's screenshots (design round 3; the password never printed)
        env:
          AUSTIN_LEADS_PASSWORD: ${{ secrets.AUSTIN_LEADS_PASSWORD }}
        run: |
          if [ -z "$AUSTIN_LEADS_PASSWORD" ]; then exit 0; fi
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq --no-install-recommends libreoffice-calc python3-uno poppler-utils fonts-liberation > /dev/null
          pip install --quiet playwright==1.48.0 && python3 -m playwright install --with-deps chromium > /dev/null
          printf '%s' "$AUSTIN_LEADS_PASSWORD" > "$RUNNER_TEMP/pw"
          mkdir -p probes "$RUNNER_TEMP/shots"
          PYTHONUNBUFFERED=1 python3 tools/leads_check.py --docs docs --app austin-leads-members --pw-file "$RUNNER_TEMP/pw" --shots "$RUNNER_TEMP/shots" \
            --capture docs/assets/leads/austin > probes/austin-app-check.txt 2>&1 || true
          rm -f "$RUNNER_TEMP/pw"
          tail -3 probes/austin-app-check.txt
      - name: The City's own rows for projects to confirm (business fields only; design round 3)
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "tools")
          import permits_austin as A
          keep = ("permit_number", "masterpermitnum", "permit_class", "work_class", "status_current", "issue_date", "total_job_valuation",
                  "total_valuation_remodel", "housing_units", "number_of_floors", "total_new_add_sqft", "remodel_repair_sqft", "original_address1", "description")
          out = {}
          for m in ("13645821", "13651802", "12872034"):
              rows = A.get(f"{A.PORTAL}/resource/{A.DATASET}.json", {"$select": ",".join(keep), "masterpermitnum": m, "$limit": 500})
              out[m] = rows
          json.dump(out, open("probes/austin-confirm.json", "w"), indent=1)
          print({m: len(r) for m, r in out.items()})
          PY
      - name: Rebuild the site pages from the new sample
        run: python3 tools/make_site.py
      - name: Commit the sample
        run: |
          # on a busy main the rebuilt pages conflict; the helper resets, rebuilds on origin/main and retries (QA Oct 26)
          bash tools/push_rebuilt.sh "Austin permit sample $(date -u +%Y-%m-%d)" \
            permits/austin docs/austin-leads-members docs/assets/leads/austin probes/austin-app-check.txt probes/austin-confirm.json
