name: Chicago permit leads sample
# Permit leads pilot (Todd approved Oct 14, 2026; coo/OPPORTUNITIES.md Case 4). The cloud agents cannot
# reach data.cityofchicago.org, so this runner pulls the City's Building Permits data and commits only
# the filtered, business-level sample to permits/chicago/ (tools/permits_chicago.py says what is kept).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/permits_chicago.py", "tools/area_seats.py", ".github/workflows/permits-chicago.yml", "site/area_seats.json"]
  schedule:
    - cron: "20 11 * * 1"   # Mondays, about 6:20 am Chicago time in daylight time
permissions:
  contents: write
concurrency:
  group: permits-chicago
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/permits_chicago.py --selftest
      - run: python3 tools/builder_contacts.py --selftest
      - run: python3 tools/permits_chicago.py --full "$RUNNER_TEMP/chicago-full.json"
      - name: Area seats, site/area_seats.json (Todd, Oct 26, 2026), held areas leave the shared list and the free sample
        run: |
          python3 tools/area_seats.py --selftest
          python3 tools/area_seats.py --shared "$RUNNER_TEMP/chicago-full.json" "$RUNNER_TEMP/chicago-shared.json"
          python3 tools/area_seats.py --shared-sample permits/chicago/sample.json "$RUNNER_TEMP/chicago-full.json"
          python3 tools/area_seats.py --week-counts "$RUNNER_TEMP/chicago-full.json"
      - name: Keep the full weekly list out of the repo (short-lived artifact for the paid list)
        uses: actions/upload-artifact@v4
        with:
          name: chicago-full
          path: ${{ runner.temp }}/chicago-full.json
          retention-days: 3
      - name: Build the members' list (encrypted; skipped until the LEADS_PASSWORD secret exists)
        env:
          LEADS_PASSWORD: ${{ secrets.LEADS_PASSWORD }}
        run: |
          if [ -z "$LEADS_PASSWORD" ]; then echo "no LEADS_PASSWORD secret yet; members' page not built"; exit 0; fi
          pip install --quiet openpyxl cryptography pillow
          python3 tools/leads_xlsx.py --selftest
          python3 tools/leads_page.py --selftest
          python3 tools/leads_app.py --selftest
          python3 tools/leads_xlsx.py "$RUNNER_TEMP/chicago-shared.json" "$RUNNER_TEMP/leads.xlsx"
          # the members' app (v2, live since Todd's go on Oct 17, 2026); rollback to the v1 page: see MAP.md
          python3 tools/leads_app.py "$RUNNER_TEMP/chicago-shared.json" "$RUNNER_TEMP/leads.xlsx" docs/chicago-leads-members/index.html
          python3 tools/leads_page.py --review "$RUNNER_TEMP/chicago-shared.json" permits/chicago/review.enc.json
      - name: Build the area seat pages (one password each; skipped until the AREA_SEAT_KEY secret exists)
        env:
          LEADS_PASSWORD: ${{ secrets.LEADS_PASSWORD }}
          AREA_SEAT_KEY: ${{ secrets.AREA_SEAT_KEY }}
        run: |
          if [ -z "$AREA_SEAT_KEY" ]; then echo "no AREA_SEAT_KEY secret yet; seat pages not built"; exit 0; fi
          python3 tools/area_seats.py --build "$RUNNER_TEMP/chicago-full.json"
      - name: Rebuild the site pages from the new sample
        run: python3 tools/make_site.py
      - name: Commit the sample
        run: |
          git config user.name "proofnotfluff-bot"
          git config user.email "proofnotfluff-bot@users.noreply.github.com"
          git add permits/chicago docs
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Chicago permit sample $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
