name: Video watch
# Lets a run ask Google's Gemini about a public YouTube video without the key ever entering a Claude session
# (Todd's go, live chat, Oct 29, 2026: "key added"; skill .claude/skills/watch-video). A run commits
# video/watch/jobs/<name>.json ({"source": "<public YouTube link>", "question": "..."}); this workflow answers each new
# job with tools/watch_video.py and the GEMINI_API_KEY secret (never printed) and commits video/watch/answers/<name>.md.
# Public YouTube links only: nothing is downloaded and no file is uploaded from here.
on:
  push:
    branches: [main]
    paths: ["video/watch/jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Self-test (offline)
        run: |
          pip install --quiet -c .github/ci-constraints.txt pytest
          python3 -m pytest -q -p no:cacheprovider tools/test_watch_video.py
      - name: Answer new jobs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p video/watch/answers
          start=$(date +%s)
          for job in video/watch/jobs/*.json; do
            [ -e "$job" ] || continue
            # Time budget (Nov 8: the 30 minute cap cancelled a batch of 8 after 6 answers and committed none): start no new
            # job after 55 minutes, so the commit step always runs; the rest wait for the next push or a manual run.
            if [ $(( $(date +%s) - start )) -gt 3300 ]; then echo "time budget used; later jobs wait"; break; fi
            name=$(basename "$job" .json)
            out="video/watch/answers/$name.md"
            [ -f "$out" ] && continue
            source=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"])' "$job")
            question=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("question", ""))' "$job")
            sp=$(python3 -c 'import json,sys; print("yes" if json.load(open(sys.argv[1])).get("sourceprint") else "no")' "$job")
            set +e
            if [ "$sp" = "yes" ]; then
              # A sourceprint job (Todd, live chat, Nov 7, 2026, 2:45 pm: "key added", the proven lane's transcript step): the
              # transcript is someone else's words, so it never enters the repo. It is hashed into
              # video/studio/research/proven/<video id>.json (anim.py sourceprint) and the answer file says only that.
              python3 tools/watch_video.py "$source" --question "$question" > "$RUNNER_TEMP/answer.md" 2> err.txt
              code=$?
              if [ "$code" -eq 0 ]; then
                python3 -c 'import sys; t=open(sys.argv[1]).read(); print(t.split("## Answer", 1)[-1])' "$RUNNER_TEMP/answer.md" > "$RUNNER_TEMP/words.txt"
                python3 video/studio/anim.py sourceprint "$source" "$RUNNER_TEMP/words.txt" "Gemini transcript and on-screen text (video-watch workflow), $(date -u +%Y-%m-%d)" > sp.txt 2>> err.txt
                code=$?
              fi
              { echo "# Sourceprint job"; echo; echo "- Source: $source"; echo "- The words are withheld (someone else's words); only salted hashes of their word runs were kept."; cat sp.txt 2>/dev/null
                if [ "$code" -ne 0 ]; then python3 -c 'import sys; t=open(sys.argv[1]).read(); print("## Unavailable" + t.split("## Unavailable", 1)[1] if "## Unavailable" in t else "")' "$RUNNER_TEMP/answer.md" 2>/dev/null; fi; } > "$out"
              rm -f "$RUNNER_TEMP/answer.md" "$RUNNER_TEMP/words.txt" sp.txt
            else
              python3 tools/watch_video.py "$source" --question "$question" > "$out" 2> err.txt
              code=$?
            fi
            set -e
            if [ "$code" -ne 0 ]; then
              { echo; echo "Exit $code."; cat err.txt; } >> "$out"
            fi
            echo "$name: exit $code"
          done
          rm -f err.txt
      - name: Commit answers
        run: |
          git config user.name "video-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video/watch/answers video/studio/research/proven
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "video-watch: answers"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
