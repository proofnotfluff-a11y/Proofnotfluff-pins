<svg xmlns="http://www.w3.org/2000/svg" width="340" height="104" viewBox="0 0 340 104" role="img" aria-labelledby="t d"><title id="t">Chicago Rat Index: Bridgeport, 13th of 77</title><desc id="d">Bridgeport ranks 13th of Chicago's 77 community areas for rat complaints to 311 per 1,000 residents: 2.39 in the 30 days to Oct 26, 2026 (79 complaints). By ProofNotFluff, from City of Chicago data.</desc><rect width="340" height="104" rx="12" fill="#1d2433"/><rect x="0" y="0" width="6" height="104" rx="3" fill="#c8502f"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="20" y="24" font-size="11" font-weight="700" letter-spacing="1.2" fill="#e88062">CHICAGO RAT INDEX</text><text x="326" y="24" font-size="11" fill="#b9c0ce" text-anchor="end">proofnotfluff.com</text><text x="20" y="51" font-size="20" font-weight="700" fill="#ffffff">Bridgeport</text><text x="20" y="73" font-size="13.5" fill="#e8ebf1">13th of 77 areas · 2.39 per 1,000 residents</text><text x="20" y="92" font-size="11.5" fill="#b9c0ce">311 rat complaints, 30 days to Oct 26, 2026</text></g></svg>
