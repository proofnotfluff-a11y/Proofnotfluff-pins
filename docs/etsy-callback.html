<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>ProofNotFluff: Etsy approval code</title>
<style>
body{margin:0;background:#F5F2EC;color:#1D2433;font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
main{background:#fff;border:1px solid #E3DED3;border-radius:14px;padding:28px;max-width:560px;width:100%;box-shadow:0 8px 24px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 8px} p{margin:8px 0;color:#4A5163}
code{display:block;background:#1D2433;color:#F5F2EC;padding:14px;border-radius:10px;word-break:break-all;font-size:15px;margin:14px 0}
button{background:#C8502F;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:600;cursor:pointer;min-height:44px}
.err{color:#B23A2A}
</style></head><body><main>
<h1>Etsy approval code</h1>
<div id="out"><p>Waiting for Etsy...</p></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), out=document.getElementById('out');
  var code=q.get('code'), state=q.get('state'), err=q.get('error');
  function t(tag,txt,cls){var e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
  out.textContent='';
  if(err){out.appendChild(t('p','Etsy did not approve access: '+err,'err'));return}
  if(!code){out.appendChild(t('p','No code here. Open the approval link the crew gave you in chat.'));return}
  out.appendChild(t('p','Copy this and paste it into your Claude chat. It works once and expires in minutes.'));
  var c=t('code',code+(state?' '+state:''));out.appendChild(c);
  var b=t('button','Copy code');b.onclick=function(){navigator.clipboard.writeText(c.textContent).then(function(){b.textContent='Copied'})};out.appendChild(b);
  history.replaceState(null,'',location.pathname);
})();
</script></body></html>
